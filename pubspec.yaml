name: warmad
description: "Warmad: kasir, stok, dan kas untuk warung Madura."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_maps_flutter: ^2.18.2
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.22
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/warmad-splash.png
    - assets/brand/warmad-splash-dark.png

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/warmad-icon-1024.png
  adaptive_icon_background: "#1F6B45"
  adaptive_icon_foreground: assets/brand/warmad-icon-foreground-1024.png
  min_sdk_android: 24

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#FBF7EE"
  image: assets/brand/warmad-splash.png
  color_dark: "#1A2B22"
  image_dark: assets/brand/warmad-splash-dark.png
  android_12:
    color: "#1F6B45"
    image: assets/brand/warmad-icon-foreground-1024.png
    color_dark: "#1F6B45"
    image_dark: assets/brand/warmad-icon-foreground-1024.png
